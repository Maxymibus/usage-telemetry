<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="50%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#c084fc"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="0.5">
    <line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="80" y1="0" x2="80" y2="320"/><line x1="160" y1="0" x2="160" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="320"/><line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/><line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="560" y1="0" x2="560" y2="320"/><line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/><line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="880" y1="0" x2="880" y2="320"/><line x1="960" y1="0" x2="960" y2="320"/>
    <line x1="1040" y1="0" x2="1040" y2="320"/><line x1="1120" y1="0" x2="1120" y2="320"/>
  </g>

  <!-- Flywheel icon -->
  <g transform="translate(100, 110)" filter="url(#softglow)">
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.9"/>
    <circle cx="50" cy="50" r="30" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.5" stroke-dasharray="6 4"/>
    <circle cx="50" cy="50" r="8" fill="url(#accent)" opacity="0.8"/>
    <!-- Spokes -->
    <line x1="50" y1="4" x2="50" y2="20" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <line x1="50" y1="80" x2="50" y2="96" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    <line x1="4" y1="50" x2="20" y2="50" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
    <line x1="80" y1="50" x2="96" y2="50" stroke="#818cf8" stroke-width="2" opacity="0.6"/>
    <!-- Diagonal spokes -->
    <line x1="17" y1="17" x2="29" y2="29" stroke="#c084fc" stroke-width="1.5" opacity="0.4"/>
    <line x1="71" y1="71" x2="83" y2="83" stroke="#c084fc" stroke-width="1.5" opacity="0.4"/>
    <line x1="83" y1="17" x2="71" y2="29" stroke="#c084fc" stroke-width="1.5" opacity="0.4"/>
    <line x1="17" y1="83" x2="29" y2="71" stroke="#c084fc" stroke-width="1.5" opacity="0.4"/>
    <!-- Rotation arrows -->
    <path d="M 75 18 A 38 38 0 0 1 88 40" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.7"/>
    <polygon points="88,40 92,33 84,34" fill="#38bdf8" opacity="0.7"/>
    <path d="M 25 82 A 38 38 0 0 1 12 60" fill="none" stroke="#818cf8" stroke-width="1.8" opacity="0.7"/>
    <polygon points="12,60 8,67 16,66" fill="#818cf8" opacity="0.7"/>
  </g>

  <!-- Title -->
  <text x="260" y="138" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="white" letter-spacing="-1">Flywheel</text>

  <!-- Subtitle -->
  <text x="260" y="174" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#94a3b8" font-weight="400">SaaS Log Intelligence → Agent Architecture</text>

  <!-- Pipeline visualization -->
  <g transform="translate(260, 200)">
    <!-- Nodes -->
    <rect x="0" y="0" width="120" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="60" y="23" font-family="system-ui, sans-serif" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="600">CSV Upload</text>

    <rect x="160" y="0" width="120" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="220" y="23" font-family="system-ui, sans-serif" font-size="12" fill="#818cf8" text-anchor="middle" font-weight="600">App Insights</text>

    <rect x="320" y="0" width="140" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="390" y="23" font-family="system-ui, sans-serif" font-size="12" fill="#c084fc" text-anchor="middle" font-weight="600">KQL Extraction</text>

    <rect x="500" y="0" width="140" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="570" y="23" font-family="system-ui, sans-serif" font-size="12" fill="#f472b6" text-anchor="middle" font-weight="600">Azure OpenAI</text>

    <rect x="680" y="0" width="150" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="755" y="23" font-family="system-ui, sans-serif" font-size="12" fill="#34d399" text-anchor="middle" font-weight="600">Agent Insights</text>

    <!-- Arrows -->
    <g stroke="#475569" stroke-width="1.5" fill="none">
      <line x1="122" y1="18" x2="158" y2="18"/>
      <polygon points="155,14 162,18 155,22" fill="#475569"/>
      <line x1="282" y1="18" x2="318" y2="18"/>
      <polygon points="315,14 322,18 315,22" fill="#475569"/>
      <line x1="462" y1="18" x2="498" y2="18"/>
      <polygon points="495,14 502,18 495,22" fill="#475569"/>
      <line x1="642" y1="18" x2="678" y2="18"/>
      <polygon points="675,14 682,18 675,22" fill="#475569"/>
    </g>
  </g>

  <!-- Stats -->
  <g transform="translate(260, 262)">
    <text font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
      <tspan x="0" font-weight="600" fill="#38bdf8">27</tspan>
      <tspan dx="4">KQL Queries</tspan>
      <tspan dx="20" fill="#334155">·</tspan>
      <tspan dx="20" font-weight="600" fill="#818cf8">5</tspan>
      <tspan dx="4">Evidence Packs</tspan>
      <tspan dx="20" fill="#334155">·</tspan>
      <tspan dx="20" font-weight="600" fill="#c084fc">Entra ID</tspan>
      <tspan dx="4">Auth</tspan>
      <tspan dx="20" fill="#334155">·</tspan>
      <tspan dx="20" font-weight="600" fill="#34d399">.NET 9</tspan>
      <tspan dx="4">+ ASP.NET Core</tspan>
    </text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>
</svg>
